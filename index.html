<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <h3>Game Over</h3>
            <p></p>
            <button class="modal-close">Play again</button>
        </div>
    </div>

    <main class="container">
        <aside class="hangman-side">
            <div class="hangman-card">
                <img src="images/hangman-0.svg" alt="">
            </div>
            <p class="title">hangman</p>
        </aside>

        <section class="game-side">
            <ul class="word-display"></ul>

            <div class="hint-block">
                <p class="hint-text"></p>
            </div>

            <div class="status-row">
                <p class="guess-text">
                    misses <span class="wrong-count">0</span>/<span class="max-guess">6</span>
                </p>
                <div class="attempts-bar">
                    <span class="attempt-segment"></span>
                    <span class="attempt-segment"></span>
                    <span class="attempt-segment"></span>
                    <span class="attempt-segment"></span>
                    <span class="attempt-segment"></span>
                    <span class="attempt-segment"></span>
                </div>
            </div>

            <div class="keyboard"></div>
        </section>
    </main>

    <script src="wordList.js"></script>
    <script src="app.js"></script>
</body>
</html>
